name: ci

on:
    push:
        paths:
            - "**.py"
            - "**.cpp"
            - "**.hpp"
            - "**.cmake"
            - "**/CMakeLists.txt"
            - "**/.clang-tidy"
            - "**/tests.yaml"
            - "pyproject.toml"
        branches:
            - "**"
        tags-ignore:
            - "**"
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    linux:
        strategy:
            fail-fast: false
            matrix:
                python:
                    - "3.8.12"
                    - "3.9"
                    - "3.10"
                    - "3.11"
                    - "3.12"
                    - "3.13"

        runs-on: ubuntu-latest

        defaults:
            run:
                shell: bash

        env:
            CXX: clang++
            CC: clang

        steps:
            - name: Install base dependencies
              run: |
                  sudo rm -f /var/lib/man-db/auto-update
                  sudo apt -y update
                  sudo apt -y install --no-install-recommends clang-tidy

            - name: Install python
              uses: actions/setup-python@v5
              with:
                  python-version: "${{ matrix.python }}"

            - name: Install python dependencies
              run: |
                  python -m pip install --upgrade pip build setuptools wheel

            - uses: actions/checkout@v4
              with:
                  path: repo

            - name: Install clang-tidier
              run: |
                  cd repo
                  python -m pip install --upgrade .

            - name: Print help and version
              run: |
                  clang-tidier --where
                  clang-tidier --version
                  clang-tidier --help

            - name: Configure test project
              run: |
                  cmake -B build -S ./repo/tests/test_project

            - name: Run on test_project
              run: |
                  clang-tidier build
